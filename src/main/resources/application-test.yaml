server:
  error:
    include-stacktrace: never
  port: 8100
spring:
  jpa:
    open-in-view: true
  datasource:
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/proof
  # mvc:
    # converters:
      # preferred-json-mapper: gson
  application:
    name: Spring Boot Base
  devtools:
    livereload:
      port: 55555
      enabled: false
    add-properties: true
  docker:
    compose:
      enabled: false
      file: docker/docker-compose.yaml
      profiles:
        active: dev
  main:
    lazy-initialization: true
    banner-mode: off
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/master
          jwk-set-uri: http://localhost:8080/realms/master/protocol/openid-connect/certs
      client:
        provider:
          keycloak:
            token-uri: ""
timezone: Europe/Berlin
springdoc:
  show-actuator: false
logging:
  level:
    root: off
