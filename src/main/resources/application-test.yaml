server:
  error:
    include-stacktrace: never
  port: 8100
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  sql:
    init:
      mode: never
      platform: all
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
        enable_lazy_load_no_trans: true
        event:
          merge:
            entity_copy_observer: allow
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DATABASE_TO_LOWER=TRUE;
  application:
    name: PROOF Config Manager
  main:
    lazy-initialization: false
    banner-mode: off
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/proof
          jwk-set-uri: http://localhost:8080/realms/proof/protocol/openid-connect/certs
      client:
        provider:
          keycloak:
            token-uri: http://localhost:8080/realms/proof/protocol/openid-connect/token
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: proof
            client-secret: TE8xwoZlEA3UvKc2CL6bWLOhVWpDvQSb
            client-name: proof
            authorization-grant-type: client_credentials
  h2:
    console:
      enabled: false
timezone: Europe/Berlin
springdoc:
  show-actuator: false
logging:
  level:
    root: off
file:
  storage:
    root: "/tmp/proof"
websocket:
  broker:
    relayHost: "localhost"