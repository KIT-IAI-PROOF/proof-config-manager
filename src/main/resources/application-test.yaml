server:
  error:
    include-stacktrace: never
  port: 8100
spring:
  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379
  sql:
    init:
      mode: always
      platform: all
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test;DB_CLOSE_ON_EXIT=FALSE
  application:
    name: PROOF Config Manager
  main:
    lazy-initialization: false
    banner-mode: off
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/proof
          jwk-set-uri: http://localhost:8080/realms/proof/protocol/openid-connect/certs
      client:
        provider:
          keycloak:
            token-uri: http://localhost:8080/realms/proof/protocol/openid-connect/token
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: proof
            client-secret: TE8xwoZlEA3UvKc2CL6bWLOhVWpDvQSb
            client-name: proof
            authorization-grant-type: client_credentials

  h2:
    console:
      enabled: true
timezone: Europe/Berlin
springdoc:
  show-actuator: false
logging:
  level:
    root: off