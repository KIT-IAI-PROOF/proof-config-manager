server:
  error:
    include-stacktrace: never
  port: 8100
spring:
  sql:
    init:
      mode: always
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: false
  datasource:
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/proof
  # mvc:
    # converters:
      # preferred-json-mapper: gson
  application:
    name: Spring Boot Base
  devtools:
    livereload:
      port: 55555
      enabled: false
    add-properties: true
  docker:
    compose:
      enabled: false
      file: docker/docker-compose.yaml
      profiles:
        active: dev
  main:
    lazy-initialization: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/proof
          jwk-set-uri: http://localhost:8080/realms/proof/protocol/openid-connect/certs
      client:
        provider:
          keycloak:
            token-uri: http://localhost:8080/realms/proof/protocol/openid-connect/token
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: proof
            client-secret: TE8xwoZlEA3UvKc2CL6bWLOhVWpDvQSb
            client-name: proof
            authorization-grant-type: client_credentials
timezone: Europe/Berlin
springdoc:
  show-actuator: false
